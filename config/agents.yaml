# Unified Agent Registry - Single Source of Truth
# Used by: Coordinator, Dashboard, PlantUML Generator
# Version: 1.1 - Added tier annotations and batch processing agents

# Model Tiers — these are COMPLEXITY BANDS, not providers.
# - fast:     quick operations        -> band `small`
# - standard: balanced quality/cost   -> band `medium`
# - premium:  high quality            -> band `high`
#
# WHICH PROVIDER AND MODEL SERVES A BAND IS NOT DECIDED HERE. It is decided by
# rapid-llm-proxy at call time from `config/llm-routing.yaml`, per `bg-<process>`
# route, and it changes without this file knowing. Ask the proxy, never this file:
#   curl -s 'localhost:12435/api/llm/routing/resolve?job=bg-<process>' | jq -r .summary
#
# This block used to name models against each tier ("standard: Groq
# llama-3.3-70b-versatile"), and `llmModel:` below repeated the same string for
# ten agents. The dashboard printed it verbatim, so the UKB monitor advertised
# `Groq: llama-3.3-70b-versatile` for work Claude on gh-copilot had performed —
# groq served 0 of 1,589 calls in the 24h measured on 2026-09-23, and does not
# enter a background route's chain until two accounts ahead of it have failed.
#
# So `llmModel` is null for every routed agent. Null means "ask the router"; the
# dashboard resolves the live provider from token_usage and says "not yet called"
# when there is nothing to report. Only non-routed facts are stated literally
# below — an embedder, a similarity metric, an external tool with its own config.

# LLM Modes (per-agent or global):
# - mock: Fake responses for testing (fast, no API costs)
# - local: Docker Model Runner (llama.cpp, localhost:12434)
# - public: routed by rapid-llm-proxy (see above) — NOT a fixed provider

# Wave Controller - Orchestrates hierarchical wave execution
orchestrator:
  id: orchestrator
  name: Wave Controller
  shortName: Waves
  icon: Play
  description: "Hierarchical wave orchestration engine. Executes 4 sequential waves (Project→Component→Detail→Insights), each with parallel agents bounded by concurrency limits."
  usesLLM: false
  llmModel: null
  techStack: "Wave Controller"
  phase: 0
  row: -1
  col: 0.6         # Centered (aligned with single-agent column)

# 16 Workflow Agents (13 original + 3 batch processing)
agents:
  # --- Batch Processing Agents ---
  # Layout for batch-analysis workflow (phased swimlane approach):
  # - Phase 0 (Initialization): Batch Scheduler plans all batches
  # - Phase 1-4 (Batch Loop): Git/Vibe → Semantic → KG Ops → QA → Checkpoint (repeats)
  # - Phase 5+ (Finalization): Persist → Dedup → Validate

  - id: batch_scheduler
    name: Data Preparation
    shortName: Prep
    icon: Calendar
    description: "Plans and tracks chronological batch windows. Divides git history into 50-commit batches for incremental processing with checkpoint-based resumption."
    usesLLM: false
    llmModel: null
    tier: fast
    techStack: "Git CLI + Checkpoint Manager"
    phase: 0
    row: -0.5       # Between orchestrator and main flow
    col: 0.6        # Centered in column

  - id: kg_operators
    name: KG Operators
    shortName: KG-Ops
    icon: Network
    description: "Tree-KG inspired operators for incremental knowledge graph expansion. Implements conv, aggr, embed, dedup, pred, merge operators per batch."
    usesLLM: true
    llmModel: "Multi-tier: fast/standard/premium per operator"
    tier: standard  # Default tier, operators override individually
    defaultLLMMode: public  # mock | local | public
    operator_tiers:
      conv: premium    # Context enrichment needs quality
      aggr: standard   # Role assignment is straightforward
      embed: fast      # Just embedding API calls
      dedup: standard  # Similarity + role check
      pred: premium    # Edge prediction needs reasoning
      merge: standard  # Structure fusion is algorithmic
    techStack: "SemanticAnalyzer + Embeddings"
    phase: 3
    row: 3          # After ontology (row 2), before QA (row 4)
    col: 0.6        # Centered in main flow column

  - id: batch_checkpoint_manager
    name: Batch Checkpoint
    shortName: Checkpoint
    icon: Save
    description: "Per-batch checkpoint state management. Tracks completed batches, operator results, and supports resumption from any batch. Loops back to Git for next batch."
    usesLLM: false
    llmModel: null
    tier: fast
    techStack: "JSON file persistence"
    phase: 5
    row: 5          # After QA (row 4), before code_graph (row 6)
    col: 0.6        # Centered in column

  # --- Original Agents with tier annotations ---
  - id: git_history
    name: Git History
    shortName: Git
    icon: GitBranch
    description: "Analyzes commit history via git CLI with LLM-powered pattern extraction. Identifies code evolution patterns, development themes, architectural decisions, and technical debt from commit messages and file changes."
    usesLLM: true
    llmModel: null
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: "Git CLI + SemanticAnalyzer"
    phase: 1
    row: 0
    col: 0.25       # Left of center, adjacent to Vibe

  - id: vibe_history
    name: Vibe History
    shortName: Vibe
    icon: MessageSquare
    description: "Uses LLM semantic analysis to extract key development topics, task/solution pairs, and workflow patterns from human-AI conversation sessions. Processes LSL session logs in parallel batches."
    usesLLM: true
    llmModel: null
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: SemanticAnalyzer
    phase: 1
    row: 0
    col: 0.95       # Right of center, adjacent to Git

  - id: code_graph
    name: Code Graph
    shortName: Code
    icon: Code
    description: "Reads the graphify code graph (tree-sitter AST -> static graph.json) to surface functions, classes, imports, and call relationships. Uses an LLM only to synthesize insights over the graph. Runs in FINALIZATION phase after all batches complete."
    usesLLM: true
    llmModel: "Insight synthesis via SemanticAnalyzer (graph read is deterministic)"
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: "graphify (tree-sitter graph.json)"
    phase: 6       # FINALIZATION phase (after batch loop)
    row: 6         # After checkpoint (row 5), before persistence (row 7)
    col: 0.6       # Centered like other finalization nodes

  - id: documentation_linker
    name: Documentation Linker
    shortName: Docs
    icon: FileText
    description: "Links markdown docs and PlantUML diagrams to code entities. Uses LLM-powered semantic matching to resolve unresolved references and build intelligent doc-to-code mappings."
    usesLLM: true
    llmModel: null
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: "Regex + glob patterns + SemanticAnalyzer"
    phase: 1
    row: 0
    col: 2.25

  - id: semantic_analysis
    name: Semantic Analysis
    shortName: Semantic
    icon: Brain
    description: "Deep code analysis to detect patterns (MVC, Factory, Observer, etc.), assess quality metrics, identify anti-patterns, and generate LLM-powered insights on architecture."
    usesLLM: true
    llmModel: null
    tier: premium
    defaultLLMMode: public  # mock | local | public
    techStack: "Direct LLM clients"
    phase: 2
    row: 1
    col: 0.6        # Centered in column

  - id: web_search
    name: Web Search
    shortName: Web
    icon: Search
    description: "Searches for similar patterns, code examples, and documentation using DuckDuckGo/Google. Optional LLM-powered result summarization and intelligent ranking of top results."
    usesLLM: true
    llmModel: null
    tier: fast
    defaultLLMMode: public  # mock | local | public
    techStack: "DuckDuckGo/Google APIs + SemanticAnalyzer"
    phase: 2.5
    row: 2
    col: 0.375

  - id: insight_generation
    name: Insight Generation
    shortName: Insights
    icon: Lightbulb
    description: "Generates comprehensive insights, PlantUML architecture diagrams, design pattern documentation, and knowledge synthesis from analysis results."
    usesLLM: true
    llmModel: null
    tier: premium
    defaultLLMMode: public  # mock | local | public
    techStack: SemanticAnalyzer
    phase: 8        # FINALIZATION: After persistence (phase 7)
    row: 8          # After persistence (row 7)
    col: 0.6        # Centered in main flow

  - id: observation_generation
    name: Observation Generation
    shortName: Observations
    icon: Eye
    description: "Creates structured observations for entities: pattern observations, problem-solution pairs, architectural decisions, and contextual metadata."
    usesLLM: true
    llmModel: null
    tier: premium
    defaultLLMMode: public  # mock | local | public
    techStack: SemanticAnalyzer
    phase: 8.5      # FINALIZATION: After insight (phase 8) - used in incremental workflow
    row: 8.5        # After insight (row 8) - used in incremental workflow
    col: 0.6        # Centered in main flow

  - id: ontology_classification
    name: Ontology Classification
    shortName: Ontology
    icon: Tags
    description: "Maps entities to ontology classes (upper/lower) using LLM-powered semantic inference. Assigns categories, properties, and confidence scores with intelligent taxonomy alignment."
    usesLLM: true
    llmModel: null
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: "OntologyClassifier + SemanticAnalyzer"
    phase: 2.5       # After semantic (phase 2), before KG-Ops (phase 3)
    row: 2           # After semantic (row 1), before KG-Ops (row 3)
    col: 0.6         # Centered in main flow column

  - id: quality_assurance
    name: Quality Assurance
    shortName: QA
    icon: Shield
    description: "Validates insights, PlantUML syntax, entity coherence. LLM-powered semantic value filtering removes low-value entities. Quality-based feedback loops (up to 3 iterations) with progressive parameter tightening."
    usesLLM: true
    llmModel: null
    tier: premium
    defaultLLMMode: public  # mock | local | public
    techStack: "SemanticAnalyzer + Semantic Value Filter"
    phase: 4         # After KG-Ops (phase 3), before checkpoint (phase 5)
    row: 4           # After KG-Ops (row 3), before checkpoint (row 5)
    col: 0.6         # Centered in column

  - id: persistence
    name: Persistence
    shortName: Persist
    icon: Database
    description: "Manages entity CRUD operations, checkpoint tracking, and bi-temporal staleness detection. Writes entities with ontology metadata to LevelDB graph storage."
    usesLLM: false
    llmModel: null
    tier: fast
    techStack: "LevelDB + Graphology"
    phase: 7
    row: 7          # After code_graph (row 6)
    col: 0.6        # Centered in column

  - id: deduplication
    name: Deduplication
    shortName: Dedup
    icon: Copy
    description: "Detects duplicate entities using cosine/semantic similarity on embeddings. Merges similar entities, removes duplicate observations, and consolidates patterns. Uses OpenAI embeddings API (not generative LLM)."
    usesLLM: false
    llmModel: "fastembed: all-MiniLM-L6-v2 (384-dim)"
    tier: standard
    techStack: "OpenAI Embeddings API"
    phase: 9
    row: 9          # After insight (row 8)
    col: 0.6        # Centered in column

  - id: content_validation
    name: Content Validation
    shortName: Validate
    icon: CheckCircle2
    description: "Validates entity accuracy against current codebase. Detects git-based staleness, verifies file/command references, and regenerates stale entity content."
    usesLLM: true
    llmModel: null
    tier: standard
    defaultLLMMode: public  # mock | local | public
    techStack: SemanticAnalyzer
    phase: 10
    row: 10         # After deduplication (row 9)
    col: 0.6        # Centered in column

# Step name to agent ID mapping
# Used to map workflow step names to their executing agents
step_mappings:
  # Batch workflow steps
  plan_batches: batch_scheduler
  extract_batch_commits: git_history
  extract_batch_sessions: vibe_history
  batch_semantic_analysis: semantic_analysis
  kg_operators: kg_operators
  operator_conv: kg_operators
  operator_aggr: kg_operators
  operator_embed: kg_operators
  operator_dedup: kg_operators
  operator_pred: kg_operators
  operator_merge: kg_operators
  generate_batch_observations: observation_generation
  batch_qa: quality_assurance
  save_batch_checkpoint: batch_checkpoint_manager
  final_persist: persistence
  final_dedup: deduplication
  final_validation: content_validation

  # Complete/Incremental workflow steps (existing)
  analyze_git_history: git_history
  analyze_recent_changes: git_history
  analyze_vibe_history: vibe_history
  analyze_recent_vibes: vibe_history
  semantic_analysis: semantic_analysis
  analyze_semantics: semantic_analysis
  web_search: web_search
  generate_insights: insight_generation
  generate_observations: observation_generation
  classify_with_ontology: ontology_classification
  # Runtime substeps (derived from workflow YAML substeps field)
  sem_data_prep: semantic_analysis
  sem_llm_analysis: semantic_analysis
  sem_observation_gen: semantic_analysis
  sem_entity_transform: semantic_analysis
  obs_llm_generate: observation_generation
  obs_accumulate: observation_generation
  onto_data_prep: ontology_classification
  onto_llm_classify: ontology_classification
  onto_apply_results: ontology_classification
  index_codebase: code_graph
  index_recent_code: code_graph
  transform_code_entities: code_graph
  transform_code_entities_incremental: code_graph
  link_documentation: documentation_linker
  quality_assurance: quality_assurance
  validate_incremental_qa: quality_assurance
  persist_results: persistence
  persist_incremental: persistence
  persist_code_entities: persistence
  deduplicate_insights: deduplication
  deduplicate_incremental: deduplication
  validate_content: content_validation
  validate_content_incremental: content_validation

# Runtime substep name → visual substep ID mapping
# Maps the substep names from workflow YAML to their visual arc IDs in agent_substeps
substep_id_mappings:
  # semantic_analysis (4 runtime substeps → 4 visual arcs)
  # NOTE: Parent steps (batch_semantic_analysis) intentionally NOT mapped.
  # When paused at parent, no substep has started, so none should highlight.
  sem_data_prep: parse
  sem_llm_analysis: extract
  sem_observation_gen: relate
  sem_entity_transform: enrich
  # observation_generation (2 runtime substeps → 2 visual arcs)
  obs_llm_generate: generate
  obs_accumulate: accumulate
  # ontology_classification (3 runtime substeps → 3 visual arcs)
  onto_data_prep: match
  onto_llm_classify: validate
  onto_apply_results: extend
  # kg_operators (separate workflow steps → visual arcs)
  operator_conv: conv
  operator_aggr: aggr
  operator_embed: embed
  operator_dedup: dedup
  operator_pred: pred
  operator_merge: merge
  # code_graph
  index_codebase: index
  correlate_with_codebase: query
  synthesize_code_insights: analyze
  transform_code_entities: analyze

# Agent visual substep definitions
# Defines the sub-operations rendered as arcs around each agent node
agent_substeps:
  kg_operators:
    - id: conv
      name: Context Convolution
      shortName: Conv
      description: Extract conversational patterns and dialogue structures
      llmUsage: premium
    - id: aggr
      name: Entity Aggregation
      shortName: Aggr
      description: Aggregate similar entities based on semantic similarity
      llmUsage: standard
    - id: embed
      name: Embedding Generation
      shortName: Emb
      description: Generate vector embeddings for entities
      llmUsage: none
    - id: dedup
      name: Deduplication
      shortName: Dup
      description: Remove duplicate entities using fuzzy matching
      llmUsage: fast
    - id: pred
      name: Relation Prediction
      shortName: Pred
      description: Predict relationships between entities
      llmUsage: premium
    - id: merge
      name: Graph Merge
      shortName: Mrg
      description: Merge new entities and relations into persistent KG
      llmUsage: none

  semantic_analysis:
    - id: parse
      name: Content Parsing
      shortName: Prs
      description: Parse raw content into structured segments
      llmUsage: none
    - id: extract
      name: Entity Extraction
      shortName: Ext
      description: Extract named entities and technical concepts
      llmUsage: standard
    - id: relate
      name: Relation Discovery
      shortName: Rel
      description: Discover relationships between extracted entities
      llmUsage: standard
    - id: enrich
      name: Context Enrichment
      shortName: Enr
      description: Enrich entities with additional context and metadata
      llmUsage: fast

  observation_generation:
    - id: generate
      name: LLM Generate
      shortName: Gen
      description: Generate structured observations from semantic analysis
      llmUsage: premium
    - id: accumulate
      name: Accumulate
      shortName: Acc
      description: Accumulate and deduplicate observations across batches
      llmUsage: none

  ontology_classification:
    - id: match
      name: Class Matching
      shortName: Mch
      description: Match entities to ontology classes
      llmUsage: standard
    - id: validate
      name: Classification Validation
      shortName: Val
      description: Validate classifications against ontology constraints
      llmUsage: fast
    - id: extend
      name: Ontology Auto-Extension
      shortName: Ext
      description: Suggest new ontology classes for unclassified entities
      llmUsage: premium

  code_graph:
    - id: index
      name: Index Codebase
      shortName: Idx
      description: AST parsing and indexing
      llmUsage: none
    - id: query
      name: Query Graph
      shortName: Qry
      description: NL to Cypher queries
      llmUsage: standard
    - id: analyze
      name: Analyze Code
      shortName: Anl
      description: LLM-powered code analysis
      llmUsage: premium

  quality_assurance:
    - id: validate
      name: Entity Validation
      shortName: Val
      description: Validate entity completeness and consistency
      llmUsage: fast
    - id: score
      name: Quality Scoring
      shortName: Scr
      description: Calculate quality scores for entities
      llmUsage: none
    - id: report
      name: QA Reporting
      shortName: Rpt
      description: Generate quality assurance reports
      llmUsage: fast
